name: AcademicLevel Enterprise CI Pipeline

on:
  push:
    branches: [ main, enterprise-remediation, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Security Verification Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Platform Dependencies
        run: npm ci

      - name: TypeScript & Production Bundle Verification
        run: npm run build

      - name: Question Bank SQLite Retrieval Verification
        run: node scripts/test_qb_sqlite.mjs

      - name: Security & RLS Authorization Regression Test
        run: node scripts/test_security_gates.mjs

      - name: Database Backup & Hot Snapshot Verification
        run: node scripts/backup_database.mjs
