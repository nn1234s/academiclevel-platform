services:
  - type: web
    name: academiclevel-enterprise
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPER_ADMIN_EMAIL
        value: admin@academiclevel.in
      - key: DATA_DIR
        value: /var/data
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
